# .github/workflows/ci.yml
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 500M
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install CUDA Toolkit
        uses: Jimver/cuda-toolkit@v0.2.19
        id: cuda-toolkit
        with:
          cuda: '12.4.0'
          use-github-cache: true

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build ccache nlohmann-json3-dev

      - name: Verify nvcc
        run: nvcc -V

      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-cuda-12.4-ccache-v1-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-cuda-12.4-ccache-v1-

      - name: Configure CMake
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DATTENTION_DEBUG_DUMPS=ON
          -DCMAKE_CUDA_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build --parallel "$(nproc)"

      - name: Show compiler cache statistics
        if: always()
        run: ccache --show-stats
